      backdrop-filter: blur(12px);

      border: 1px solid rgba(248, 113, 113, 0.3);
      box-shadow: 0 4px 20px -5px rgba(153, 27, 27, 0.5);

    .btn-vault-primary:hover {

      box-shadow: 0 6px 24px -2px rgba(168, 85, 247, 0.6);
      transform: translateY(-2px);
    }
    .hub-btn {
      background: rgba(13, 16, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .hub-btn:hover {
      background: rgba(88, 28, 135, 0.3);
      border-color: rgba(192, 132, 252, 0.5);
      transform: translateY(-2px);
    }
    .hub-btn.active {
      background: linear-gradient(135deg, #991b1b 0%, #581c87 100%);
      border-color: rgba(248, 113, 113, 0.5);
      color: #fff;
      box-shadow: 0 4px 20px -5px rgba(168, 85, 247, 0.5);
    }
  </style>

<body class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-purple-200">

    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <nav aria-label="Main" class="flex items-center gap-4 sm:gap-8 text-[11px] sm:text-sm font-semibold tracking-wide sm:tracking-wider uppercase text-slate-300">
        <a href="index.html#livestreams" class="hover:text-red-400 transition-colors">Streams</a>
        <a href="wow.html" class="hover:text-purple-400 transition-colors">World Of Warcraft</a>
        <a href="index.html#youtube" class="hover:text-red-400 transition-colors">Videos</a>
        <a href="mplus.html" class="text-purple-400 font-bold transition-colors">M+ Event</a>
        <a href="index.html#community" class="hover:text-purple-400 transition-colors">Community</a>
      </nav>
      <a href="https://discord.gg/qScBpyq5gM" target="_blank" rel="noopener noreferrer" class="btn-vault-primary flex-shrink-0 px-3 sm:px-4 py-2 text-xs font-bold uppercase tracking-widest text-white rounded-lg flex items-center gap-2">
        <span>Join Discord</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main" class="max-w-6xl mx-auto px-5 py-10 flex-grow flex flex-col items-center justify-center w-full space-y-6">
    
    <!-- Hub Navigation Buttons (Τέρμα πάνω) -->
    <div class="flex flex-wrap justify-center gap-3 w-full max-w-2xl">
      <a href="mplus.html" class="hub-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        M+ Event
      </a>
      <a href="dashboard.html" class="hub-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        Dashboard
      </a>
      <a href="participants.html" class="hub-btn active flex-1 min-w-[120px] py-3 px-4 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center shadow-lg text-white">
        Participants
      </a>
      <a href="betting-desk.html" class="hub-btn flex-1 min-w-[120px] py-3 px-4 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        Betting Desk
      </a>
    </div>

    <!-- Header Card: Participants -->
    <div class="vault-card rounded-2xl p-8 sm:p-10 text-center border border-purple-900/40 space-y-2 shadow-2xl w-full">
      <h1 class="font-horde text-3xl sm:text-5xl font-black text-white glow-gold">
        Participants
      </h1>
      <p class="text-slate-400 text-sm uppercase tracking-wider font-semibold">Registered Event Competitors & Roster</p>
    </div>

    <!-- Participants Table Card -->
    <div class="vault-card rounded-2xl p-6 shadow-xl border border-purple-900/30 w-full overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-800 text-xs font-bold uppercase tracking-widest text-slate-400">
            <th class="py-3 px-4">Character</th>
            <th class="py-3 px-4">Server</th>
            <th class="py-3 px-4">Team</th>
            <th class="py-3 px-4">Role</th>
            <th class="py-3 px-4 text-center">Rating</th>
            <th class="py-3 px-4 text-right">Raider.io</th>
          </tr>
        </thead>
        <tbody id="participants-tbody" class="divide-y divide-slate-800/60 text-sm">
          <tr>
            <td colspan="6" class="text-center py-8 text-slate-500">Loading Participants...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-[#040507] border-t border-slate-900 py-8 text-center text-xs text-slate-400 space-y-2">
    <p class="font-horde font-bold text-slate-300 tracking-widest text-sm">GREDUSH M+ EVENT BROADCAST</p>
    <p>© <span id="year"></span> Gredush. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnLyEV_JrIV3Ohaq6jFFNpZhHMLpqpBztTSpVT96e1A__LREOv5T_p-Px5AZZvqzcESzEIwkFJ2XT9/pub?gid=1592864415&single=true&output=csv';

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(s => s.replace(/^"|"$/g, ''));
    }

    async function fetchParticipants() {
      try {
        const response = await fetch(CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        const text = await response.text();
        const lines = text.split('\n');
        
        const rowsHTML = [];

        // Κελιά A5:A104 (index 4 έως 103)
        // A = Raider.io Link (index 0)
        // B = Character (index 1)
        // D = Server (index 3)
        // E = Rating (index 4)
        // F = Team (index 5)
        // G = Role (index 6)
        for (let r = 4; r <= 103; r++) {
          if (lines.length > r) {
            const row = parseCSVLine(lines[r]);
            
            const raiderIo = row[0] || '';
            const character = row[1] || '';
            const server = row[3] || '';
            const rating = row[4] || '';
            const team = row[5] || '';
            const role = row[6] || '';

            // Αν υπάρχει χαρακτήρας ή team, προσθέτουμε τη γραμμή
            if (character || team) {
              const raiderLinkHTML = raiderIo ? `<a href="${raiderIo}" target="_blank" rel="noopener noreferrer" class="text-purple-400 hover:text-purple-300 underline font-semibold">Profile</a>` : '-';

              rowsHTML.push(`
                <tr class="hover:bg-slate-900/40 transition-colors">
                  <td class="py-3 px-4 font-bold text-white">${character || '-'}</td>
                  <td class="py-3 px-4 text-slate-300">${server || '-'}</td>
                  <td class="py-3 px-4 text-purple-300 font-semibold">${team || '-'}</td>
                  <td class="py-3 px-4 text-slate-300">${role || '-'}</td>
                  <td class="py-3 px-4 text-center font-mono font-bold text-amber-400">${rating || '-'}</td>
                  <td class="py-3 px-4 text-right">${raiderLinkHTML}</td>
                </tr>
              `);
            }
          }
        }

        const tbody = document.getElementById('participants-tbody');
        if (rowsHTML.length > 0) {
          tbody.innerHTML = rowsHTML.join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">No participants found in range A5:G104</td></tr>`;
        }

      } catch (err) {
        console.error('Error fetching participants data:', err);
        document.getElementById('participants-tbody').innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-400">Error loading participants data.</td></tr>`;
      }
    }

    fetchParticipants();
    setInterval(fetchParticipants, 10000);
  </script>
</body>
</html>
