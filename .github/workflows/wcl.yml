name: Update site data
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Warcraft Logs
        run: node scripts/wcl.mjs
        continue-on-error: true
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
      - name: WoWProgress
        run: node scripts/wowprogress.mjs
        continue-on-error: true
      - name: YouTube
        run: node scripts/youtube.mjs
        continue-on-error: true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || (git commit -m "Update site data" && git push)
