<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M+ Live Broadcast Dashboard | Gredush</title>
  <meta name="description" content="Live broadcast coverage and mirror for Gredush Mythic+ TV Dashboard." />
  <meta name="theme-color" content="#06070a" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CZLTE6SXJ5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CZLTE6SXJ5');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html { font-size: 110%; scroll-behavior: smooth; }
    body {
      font-family: 'Rajdhani', 'Inter', sans-serif;
      background-color: #06070a;
      color: #e2e8f0;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(153, 27, 27, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 60%, rgba(88, 28, 135, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .font-horde { font-family: 'Cinzel', serif; }
    .vault-card {
      background: rgba(13, 16, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .sheet-table td, .sheet-table th {
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 0.6rem 0.8rem;
      white-space: nowrap;
    }
    .sheet-table tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }
    .pulse-live { animation: livePulse 1.5s infinite; }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-purple-200">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#06070a]/80 border-b border-red-950/40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <nav aria-label="Main" class="flex items-center gap-4 sm:gap-8 text-[11px] sm:text-sm font-semibold tracking-wide sm:tracking-wider uppercase text-slate-300">
        <a href="index.html#livestreams" class="hover:text-red-400 transition-colors">Streams</a>
        <a href="wow.html" class="hover:text-purple-400 transition-colors">World Of Warcraft</a>
        <a href="index.html#youtube" class="hover:text-red-400 transition-colors">Videos</a>
        <a href="mplus.html" class="text-purple-400 font-bold transition-colors">M+ Event</a>
        <a href="index.html#community" class="hover:text-purple-400 transition-colors">Community</a>
      </nav>
      <a href="https://discord.gg/qScBpyq5gM" target="_blank" rel="noopener noreferrer" class="px-3 sm:px-4 py-2 text-xs font-bold uppercase tracking-widest text-white rounded-lg bg-red-900 hover:bg-red-800 transition-all flex items-center gap-2">
        <span>Join Discord</span>
      </a>
    </div>
  </header>

  <main id="main" class="max-w-7xl mx-auto px-4 py-8 space-y-6 flex-grow w-full">

    <div class="flex justify-between items-center">
      <h1 class="font-horde text-2xl sm:text-3xl font-black text-white tracking-wider flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-red-600 pulse-live inline-block"></span>
        TV DASHBOARD MIRROR
      </h1>
      <span id="sync-status" class="text-xs font-mono text-slate-400">Syncing...</span>
    </div>

    <!-- Live Mirror Table -->
    <div class="vault-card rounded-2xl p-4 sm:p-6 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left sheet-table text-xs sm:text-sm" id="dashboard-table">
          <tbody id="sheet-body">
            <tr>
              <td class="text-center py-8 text-slate-500 font-mono">Loading TV Dashboard data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="bg-[#040507] border-t border-slate-900 py-6 text-center text-xs text-slate-400 space-y-1">
    <p class="font-horde font-bold text-slate-300 tracking-widest">GREDUSH M+ EVENT BROADCAST</p>
    <p>© <span id="year"></span> Gredush. Direct Sheet Mirror.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnLyEV_JrIV3Ohaq6jFFNpZhHMLpqpBztTSpVT96e1A__LREOv5T_p-Px5AZZvqzcESzEIwkFJ2XT9/pub?output=csv';

    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const row = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(current.trim().replace(/^"|"$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        row.push(current.trim().replace(/^"|"$/g, ''));
        return row;
      });
    }

    async function updateMirror() {
      try {
        const response = await fetch(SHEET_CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        const text = await response.text();
        const rows = parseCSV(text);

        const tbody = document.getElementById('sheet-body');
        tbody.innerHTML = '';

        rows.forEach((row) => {
          // Parakampte entelos kenes grammes gia katharo result
          if (row.every(cell => cell === '')) return;

          const tr = document.createElement('tr');
          row.forEach(cellValue => {
            const td = document.createElement('td');
            td.textContent = cellValue;
            
            // Highlight me xroma an einai headers / títloi
            if (cellValue.toUpperCase().includes('TEAM') || cellValue.toUpperCase().includes('TOTAL') || cellValue.toUpperCase().includes('ROUND')) {
              td.className = 'font-bold text-purple-300 bg-purple-950/30';
            } else if (!isNaN(cellValue) && cellValue !== '') {
              td.className = 'font-mono text-slate-200';
            } else {
              td.className = 'text-slate-300';
            }

            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });

        const now = new Date();
        document.getElementById('sync-status').textContent = 'Last synced: ' + now.toLocaleTimeString();
      } catch (err) {
        console.error('Mirror sync error:', err);
        document.getElementById('sync-status').textContent = 'Sync error';
      }
    }

    // Archiki ektelesi kai refresh kathe 3 defterolepta
    updateMirror();
    setInterval(updateMirror, 3000);
  </script>
</body>
</html>
