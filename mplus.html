<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M+ Live Broadcast Dashboard | Gredush</title>
  <meta name="description" content="Live broadcast coverage and dashboard for Gredush Mythic+ events." />
  <meta name="theme-color" content="#06070a" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CZLTE6SXJ5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CZLTE6SXJ5');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html { font-size: 110%; scroll-behavior: smooth; }
    body {
      font-family: 'Rajdhani', 'Inter', sans-serif;
      background-color: #06070a;
      color: #e2e8f0;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(153, 27, 27, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 60%, rgba(88, 28, 135, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .font-horde { font-family: 'Cinzel', serif; }
    .glow-gold { text-shadow: 0 0 16px rgba(239, 68, 68, 0.4), 0 0 30px rgba(168, 85, 247, 0.2); }
    .vault-card {
      background: rgba(13, 16, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .broadcast-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    .broadcast-table th, .broadcast-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .broadcast-table tr:hover td {
      background-color: rgba(168, 85, 247, 0.04);
    }
    .pulse-live { animation: livePulse 1.5s infinite; }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-purple-200">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#06070a]/80 border-b border-red-950/40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <nav aria-label="Main" class="flex items-center gap-4 sm:gap-8 text-[11px] sm:text-sm font-semibold tracking-wide sm:tracking-wider uppercase text-slate-300">
        <a href="index.html#livestreams" class="hover:text-red-400 transition-colors">Streams</a>
        <a href="wow.html" class="hover:text-purple-400 transition-colors">World Of Warcraft</a>
        <a href="index.html#youtube" class="hover:text-red-400 transition-colors">Videos</a>
        <a href="mplus.html" class="text-purple-400 font-bold transition-colors">M+ Event</a>
        <a href="index.html#community" class="hover:text-purple-400 transition-colors">Community</a>
      </nav>
      <a href="https://discord.gg/qScBpyq5gM" target="_blank" rel="noopener noreferrer" class="px-3 sm:px-4 py-2 text-xs font-bold uppercase tracking-widest text-white rounded-lg bg-red-900 hover:bg-red-800 transition-all flex items-center gap-2">
        <span>Join Discord</span>
      </a>
    </div>
  </header>

  <main id="main" class="max-w-6xl mx-auto px-5 py-9 space-y-8 flex-grow w-full">

    <!-- Header Banner -->
    <div class="vault-card rounded-2xl p-6 border border-purple-900/40 flex flex-col md:flex-row justify-between items-center gap-4 shadow-2xl">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-red-950/80 border border-red-800/50 text-red-400 rounded-xl">
          <span class="w-4 h-4 rounded-full bg-red-600 pulse-live inline-block"></span>
        </div>
        <div>
          <div class="flex items-center gap-3">
            <span class="px-2.5 py-0.5 text-xs font-black uppercase tracking-wider rounded bg-red-600 text-white pulse-live">LIVE</span>
            <span class="text-xs font-bold uppercase tracking-widest text-purple-400">M+ BROADCAST DASHBOARD</span>
          </div>
          <h1 class="font-horde text-2xl md:text-3xl font-black text-white glow-gold mt-1">GREDUSH TV DASHBOARD</h1>
        </div>
      </div>
      <div id="sync-status" class="text-xs font-mono text-slate-400">Syncing with Google Sheets...</div>
    </div>

    <!-- Dynamic Sheet Mirror Container -->
    <div class="vault-card rounded-2xl p-6 space-y-4">
      <div class="overflow-x-auto">
        <table class="broadcast-table text-left" id="sheet-mirror-table">
          <tbody id="sheet-mirror-body">
            <tr>
              <td class="text-center py-12 text-slate-500 font-mono">Loading TV Dashboard data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="bg-[#040507] border-t border-slate-900 py-9 text-center text-xs text-slate-400 space-y-2">
    <p class="font-horde font-bold text-slate-300 tracking-widest text-sm">GREDUSH M+ EVENT BROADCAST</p>
    <p>© <span id="year"></span> Gredush. Live mirror powered by TV Dashboard.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSnLyEV_JrIV3Ohaq6jFFNpZhHMLpqpBztTSpVT96e1A__LREOv5T_p-Px5AZZvqzcESzEIwkFJ2XT9/pub?output=csv';

    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const row = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(current.trim().replace(/^"|"$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        row.push(current.trim().replace(/^"|"$/g, ''));
        return row;
      });
    }

    async function updateDashboardMirror() {
      try {
        const response = await fetch(SHEET_CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        const text = await response.text();
        const rows = parseCSV(text);

        const tbody = document.getElementById('sheet-mirror-body');
        tbody.innerHTML = '';

        rows.forEach((row, rowIndex) => {
          if (row.every(cell => cell === '')) return;

          const tr = document.createElement('tr');
          
          row.forEach((cellValue, colIndex) => {
            const td = document.createElement('td');
            td.textContent = cellValue;

            // Stilarisma analoga me ti seira kai ti thesi oste na moiazei me epangelmatiko dashboard
            if (rowIndex === 0 || cellValue.toUpperCase().includes('TEAM POWER RANKING') || cellValue === '#') {
              td.className = 'font-horde font-bold text-purple-300 text-xs uppercase tracking-wider bg-purple-950/20';
            } else if (!isNaN(cellValue) && cellValue !== '') {
              td.className = 'font-mono text-slate-200 text-sm';
            } else {
              td.className = 'text-slate-300 text-sm font-medium';
            }

            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });

        const now = new Date();
        document.getElementById('sync-status').textContent = 'Live Sync: ' + now.toLocaleTimeString();
      } catch (err) {
        console.error('Mirror error:', err);
        document.getElementById('sync-status').textContent = 'Sync connection error';
      }
    }

    updateDashboardMirror();
    setInterval(updateDashboardMirror, 3000);
  </script>
</body>
</html>
