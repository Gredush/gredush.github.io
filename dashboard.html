  <style>
    html { font-size: 110%; scroll-behavior: smooth; }
    body {
      font-family: 'Rajdhani', 'Inter', sans-serif;
      background-color: #06070a;
      color: #e2e8f0;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(153, 27, 27, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 60%, rgba(88, 28, 135, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .font-horde { font-family: 'Cinzel', serif; }
    .glow-gold { text-shadow: 0 0 16px rgba(239, 68, 68, 0.4), 0 0 30px rgba(168, 85, 247, 0.2); }
    .vault-card {
      background: rgba(13, 16, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .btn-vault-primary {
      background: linear-gradient(135deg, #991b1b 0%, #680d2b 50%, #581c87 100%);
      background-size: 200% 200%;
      transition: all 0.3s ease-in-out;
      border: 1px solid rgba(248, 113, 113, 0.3);
      box-shadow: 0 4px 20px -5px rgba(153, 27, 27, 0.5);
    }
    .btn-vault-primary:hover {
      background-position: right center;
      border-color: rgba(192, 132, 252, 0.6);
      box-shadow: 0 6px 24px -2px rgba(168, 85, 247, 0.6);
      transform: translateY(-2px);
    }
    .hub-btn {
      background: rgba(13, 16, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .hub-btn:hover {
      background: rgba(88, 28, 135, 0.3);
      border-color: rgba(192, 132, 252, 0.5);
      transform: translateY(-2px);
    }
    .hub-btn.active {
      background: linear-gradient(135deg, #991b1b 0%, #581c87 100%);
      border-color: rgba(248, 113, 113, 0.5);
      color: #fff;
      box-shadow: 0 4px 20px -5px rgba(168, 85, 247, 0.5);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-purple-200">
  <!-- Cinematic Background Banner Fade Out -->
  <div class="fixed top-0 left-0 w-full h-[50vh] sm:h-[60vh] z-0 pointer-events-none overflow-hidden opacity-35">
    <img src="mplus_banner.png" alt="Mythic Key Rush Background" class="w-full h-full object-cover object-center" />
    <div class="absolute inset-0 bg-gradient-to-b from-[#06070a]/40 via-[#06070a]/80 to-[#06070a]"></div>
  </div>

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#06070a]/80 border-b border-red-950/40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <nav aria-label="Main" class="flex items-center gap-4 sm:gap-8 text-[11px] sm:text-sm font-semibold tracking-wide sm:tracking-wider uppercase text-slate-300">
        <a href="index.html" class="hover:text-red-400 transition-colors">Home</a>
        <a href="index.html#livestreams" class="hover:text-red-400 transition-colors">Streams</a>
        <a href="wow.html" class="hover:text-purple-400 transition-colors">World Of Warcraft</a>
        <a href="index.html#youtube" class="hover:text-red-400 transition-colors">Videos</a>
        <a href="mplus.html" class="text-purple-400 font-bold transition-colors">M+ Event</a>
        <a href="index.html#community" class="hover:text-purple-400 transition-colors">Community</a>
      </nav>
      <a href="https://discord.gg/qScBpyq5gM" target="_blank" rel="noopener noreferrer" class="btn-vault-primary flex-shrink-0 px-3 sm:px-4 py-2 text-xs font-bold uppercase tracking-widest text-white rounded-lg flex items-center gap-2">
        <span>Join Discord</span>
      </a>
    </div>
  </header>
  <!-- Main Content -->
  <main id="main" class="max-w-6xl mx-auto px-5 py-10 flex-grow flex flex-col items-center justify-center w-full space-y-8">
    
    <!-- Hub Navigation Buttons -->
    <div class="flex flex-wrap justify-center gap-3 w-full max-w-4xl">
      <a href="mplus.html" class="hub-btn flex-1 min-w-[110px] py-3 px-3 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        M+ Event
      </a>
      <a href="dashboard.html" class="hub-btn flex-1 min-w-[110px] py-3 px-3 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        Dashboard
      </a>
      <a href="participants.html" class="hub-btn flex-1 min-w-[110px] py-3 px-3 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        Participants
      </a>
      <a href="betting-desk.html" class="hub-btn flex-1 min-w-[110px] py-3 px-3 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        Betting Desk
      </a>
      <a href="team-draw.html" class="hub-btn flex-1 min-w-[110px] py-3 px-3 rounded-xl font-horde font-bold text-xs sm:text-sm tracking-wider uppercase text-center text-slate-300 shadow-lg hover:text-white">
        Live Draw
      </a>
    </div>

    <!-- Header Banner (Title από A1:P1) -->
    <div class="vault-card rounded-2xl p-8 sm:p-12 text-center border border-purple-900/40 space-y-4 shadow-2xl w-full">
      <h1 id="event-title" class="font-horde text-3xl sm:text-5xl font-black text-white glow-gold">
        Loading Title...
      </h1>
      <div class="pt-2">
        <span id="sheet-info" class="text-purple-300 text-sm sm:text-base font-semibold tracking-wider uppercase">
          Push The Key Live Dashboard
        </span>
      </div>
    </div>

    <!-- Total Pot Card (Από A6:P6) -->
    <div class="vault-card rounded-2xl p-6 text-center border border-amber-500/30 shadow-xl w-full max-w-md mx-auto space-y-2">
      <span class="text-xs font-bold uppercase tracking-widest text-amber-400">Total Bet Pot</span>
      <div id="total-pot" class="font-horde text-3xl font-black text-amber-300 glow-gold">
        0 Gold
      </div>
    </div>

    <!-- 10 Team Cards Container -->
    <div id="teams-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
      <div class="text-center text-slate-500 py-10 col-span-full">Loading Teams...</div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-[#040507] border-t border-slate-900 py-8 text-center text-xs text-slate-400 space-y-2">
    <p class="font-horde font-bold text-slate-300 tracking-widest text-sm">GREDUSH M+ EVENT BROADCAST</p>
    <p>© <span id="year"></span> Gredush. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const DASHBOARD_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuSfhHzJ10BHHSi0IcNhqxtQQA5giE-YsOzbru5w_-MUwUQn0TKmzzYxTl6RngR6o_ihgdTawNA0gQ/pub?output=csv';
    const PARTICIPANTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuSfhHzJ10BHHSi0IcNhqxtQQA5giE-YsOzbru5w_-MUwUQn0TKmzzYxTl6RngR6o_ihgdTawNA0gQ/pub?gid=210972549&single=true&output=csv';
    const AVGRATING_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuSfhHzJ10BHHSi0IcNhqxtQQA5giE-YsOzbru5w_-MUwUQn0TKmzzYxTl6RngR6o_ihgdTawNA0gQ/pub?gid=2009915968&single=true&output=csv';

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(s => s.replace(/^"|"$/g, ''));
    }

    function getFirstValidValue(row, startCol, endCol) {
      for (let i = startCol; i <= endCol; i++) {
        if (row[i] && row[i].trim() !== '') {
          return row[i].trim();
        }
      }
      return '';
    }

    function getRoleIcon(role) {
      const r = role.toLowerCase();
      if (r.includes('tank')) {
        return '<span title="Tank" class="text-blue-400 font-bold inline-block mr-1">🛡️</span>';
      } else if (r.includes('heal')) {
        return '<span title="Healer" class="text-emerald-400 font-bold inline-block mr-1">✝️</span>';
      } else {
        return '<span title="DPS" class="text-red-400 font-bold inline-block mr-1">⚔️</span>';
      }
    }

    async function fetchData() {
      try {
        const [dashRes, partRes, avgRes] = await Promise.all([
          fetch(DASHBOARD_CSV_URL + '&_t=' + Date.now() + '&nocache=' + Math.random(), { cache: 'no-store' }),
          fetch(PARTICIPANTS_CSV_URL + '&_t=' + Date.now() + '&nocache=' + Math.random(), { cache: 'no-store' }),
          fetch(AVGRATING_CSV_URL + '&_t=' + Date.now() + '&nocache=' + Math.random(), { cache: 'no-store' })
        ]);

        const dashText = await dashRes.text();
        const partText = await partRes.text();
        const avgText = await avgRes.text();

        const dashLines = dashText.split('\n');
        const partLines = partText.split('\n');
        const avgLines = avgText.split('\n');

        const teamAvgRatings = {};
        for (let r = 5; r <= 10; r++) {
          if (avgLines.length > r && avgLines[r].trim() !== '') {
            const row = parseCSVLine(avgLines[r]);
            const teamName = row[0] ? row[0].trim() : ''; // A6:A11
            const avgVal = row[5] ? row[5].trim() : '';    // F6:F11
            if (teamName) {
              teamAvgRatings[teamName.toLowerCase()] = avgVal;
            }
          }
        }

        const teamMembers = {};
        for (let r = 5; r <= 104; r++) {
          if (partLines.length > r && partLines[r].trim() !== '') {
            const row = parseCSVLine(partLines[r]);
            const characterName = row[1] || ''; // Στήλη B
            const team = row[5] || '';          // Στήλη F
            const role = row[6] || '';          // Στήλη G

            if (team && characterName) {
              const cleanTeam = team.trim();
              if (!teamMembers[cleanTeam]) {
                teamMembers[cleanTeam] = [];
              }
              teamMembers[cleanTeam].push({ name: characterName, role: role || 'DPS' });
            }
          }
        }
        
        if (dashLines.length > 0) {
          const row1 = parseCSVLine(dashLines[0]);
          const titleVal = getFirstValidValue(row1, 0, 15);
          if (titleVal) document.getElementById('event-title').textContent = titleVal;
        }

        if (dashLines.length > 5) {
          const row6 = parseCSVLine(dashLines[5]);
          const potVal = getFirstValidValue(row6, 0, 15);
          if (potVal) document.getElementById('total-pot').textContent = potVal;
        }

        const teamsHTML = [];
        for (let r = 9; r <= 18; r++) {
          if (dashLines.length > r) {
            const row = parseCSVLine(dashLines[r]);
            
            const teamName = getFirstValidValue(row, 0, 4);   // A10:E10
            const currentDungeon = getFirstValidValue(row, 5, 9); // F10:J10
            const keyLevel = getFirstValidValue(row, 10, 12);     // K10:M10
            const winningOdds = getFirstValidValue(row, 13, 15);  // N10:P10

            if (teamName || currentDungeon) {
              const members = teamMembers[teamName] || [];
              const membersHTML = members.length > 0 
                ? members.map(m => `
                    <div class="text-xs text-slate-300 py-0.5 flex items-center">
                      ${getRoleIcon(m.role)}
                      <span class="font-semibold text-slate-200">${m.name}</span>
                    </div>
                  `).join('')
                : `<div class="text-slate-500 text-xs italic">No registered members found.</div>`;

              const avgRatingVal = teamAvgRatings[teamName.trim().toLowerCase()] || '-';

              teamsHTML.push(`
                <div class="vault-card rounded-2xl p-6 space-y-4 border border-purple-900/30 shadow-xl transition-all hover:border-purple-600/50">
                  <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-horde text-xl font-bold text-white uppercase tracking-wider flex items-center gap-2">
                      <span class="w-3 h-3 rounded-full bg-red-600 inline-block shadow-[0_0_10px_rgba(220,38,38,0.8)]"></span>
                      ${teamName || 'Unassigned Team'}
                    </h3>
                    <div class="flex items-center gap-2">
                      <!-- Green Box for Avg Rating -->
                      <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">
                        Avg: ${avgRatingVal}
                      </span>
                      <!-- Yellow/Amber Box for Odds -->
                      <span class="text-xs uppercase tracking-widest text-amber-400 font-bold bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20">
                        Odds: ${winningOdds || '-'}
                      </span>
                    </div>
                  </div>

                  <!-- Team Roster Members -->
                  <div class="space-y-1">
                    <span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold block mb-1">Team Roster</span>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1">
                      ${membersHTML}
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800/80">
                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                      <span class="text-[11px] uppercase tracking-widest text-slate-400 font-bold block mb-1">Current Dungeon</span>
                      <span class="font-horde text-sm sm:text-base font-bold text-purple-300 truncate block">
                        ${currentDungeon || 'Waiting...'}
                      </span>
                    </div>

                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-center">
                      <span class="text-[11px] uppercase tracking-widest text-slate-400 font-bold block mb-1">Key Level</span>
                      <span class="font-mono text-lg font-black text-amber-400">
                        ${keyLevel || '-'}
                      </span>
                    </div>
                  </div>
                </div>
              `);
            }
          }
        }

        const container = document.getElementById('teams-container');
        if (teamsHTML.length > 0) {
          container.innerHTML = teamsHTML.join('');
        } else {
          container.innerHTML = `<div class="text-center text-slate-500 py-10 col-span-full">No active teams found.</div>`;
        }

      } catch (err) {
        console.error('Error fetching dashboard data:', err);
      }
    }

    fetchData();
    setInterval(fetchData, 4000);
  </script>
</body>
</html>
